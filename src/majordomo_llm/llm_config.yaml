# LLM Provider Configuration
# Costs are specified in USD per million tokens.
#
# Prompt-cache pricing (optional per model):
#   cached_input_cost  – price per million cache-READ tokens.
#   cache_write_cost   – price per million cache-CREATION tokens (Anthropic /
#                        Bedrock only; other providers have no distinct write rate).
# When a field is omitted, no cache cost is modelled for that token class:
#   - OpenAI-family (subset accounting): cached reads fall back to input_cost.
#   - Anthropic/Bedrock (additive accounting): cache read/write contribute 0.
# The values below follow each provider's published, stable cache-pricing
# convention rather than per-model quotes:
#   - Anthropic / Bedrock Mantle: read = 0.10x input, 5-min write = 1.25x input.
#   - OpenAI GPT-5 line: cached = 0.10x input; GPT-4.1 / o-series: 0.25x input.
#   - Gemini: implicit-cache read = 0.25x input (storage fees not modelled).
#   - DeepSeek: cache-hit read = 0.10x input.
#   - Fireworks / Together: no separate cache tier — cached reads bill at
#     input_cost, so cached_input_cost is intentionally left unset.
#   - Baseten / DeepInfra / Moonshot / Novita: every registered SKU publishes a
#     discounted cache tier, so cached_input_cost is set per model.
#   - Nebius: no cached-token rate is published, so cached_input_cost is unset.

