# Nebius Token Factory (OpenAI-compatible). Formerly Nebius AI Studio; keys
# provisioned against the legacy api.studio.nebius.com host reach it via base_url.
# Model IDs are HF-style and case-sensitive.
#
# Rates and IDs confirmed 2026-08-19 from GET /v1/models?verbose=true, whose
# per-model ``pricing.prompt`` / ``pricing.completion`` are per-token (x1e6 here).
# That response carries no cached-token rate, so cached_input_cost is left unset
# and cached reads bill at input_cost — same as Fireworks and Together.
#
# Do NOT derive capability flags from that response; only its pricing fields have
# proven trustworthy. Measured against the live API on 2026-08-19:
#   - supported_sampling_parameters is wrong. It reports [] for both Kimi SKUs,
#     yet all five models accept temperature + top_p.
#   - supported_features omits structured_outputs for GLM-5.2, Kimi-K2.6 and
#     Kimi-K3. GLM-5.2 and Kimi-K3 in fact conform 5/5 on a strict json_schema
#     request, so the flag is wrong for them.
#   - Kimi-K2.6 is the real exception: it ACCEPTS response_format and the schema
#     does reach the model, but decoding is not grammar-constrained, so it drops
#     to prose on roughly 3 of 5 calls. Structured output is unreliable there.
nebius:
  models:
    deepseek-ai/DeepSeek-V4-Pro:
      input_cost: 1.75
      output_cost: 3.50
    moonshotai/Kimi-K2.6:
      input_cost: 0.95
      output_cost: 4.00
      # Accepts json_schema without enforcing it — conformed on only 2 of 5 live
      # samples, answering in prose otherwise. Fail fast rather than intermittently.
      supports_structured_outputs: false
    moonshotai/Kimi-K3:
      input_cost: 3.00
      output_cost: 15.00
    zai-org/GLM-5.1:
      input_cost: 1.40
      output_cost: 4.40
    zai-org/GLM-5.2:
      input_cost: 1.40
      output_cost: 4.40

# DeepInfra (OpenAI-compatible). Note the OpenAI-compatible routes are nested
# under /v1/openai rather than /v1. Model IDs are HF-style and case-sensitive.
# DeepInfra undercuts Fireworks and Together on every model registered here.
#
# Rates below are DeepInfra's STANDARD tier, confirmed 2026-08-19 against the
# unauthenticated catalog at https://api.deepinfra.com/models/list, which is the
# authoritative source and lists far more models than the site's featured page.
# There, pricing.cents_per_input_token is cents per token (x1e4 for USD per
# million) and pricing.rate_per_input_token_cached is a RATIO of the input rate,
# not an absolute price. DeepInfra also sells Priority (1.5x) and Flex (0.8x)
# tiers on the same models; requests routed to either will be mispriced by that
# multiplier, since the tier is not modeled here.
deepinfra:
  models:
    deepseek-ai/DeepSeek-V4-Pro:
      input_cost: 1.30
      output_cost: 2.60
      cached_input_cost: 0.10
    moonshotai/Kimi-K2.6:
      input_cost: 0.75
      output_cost: 3.50
      cached_input_cost: 0.15
    moonshotai/Kimi-K3:
      input_cost: 2.85
      output_cost: 14.25
      cached_input_cost: 0.285
    zai-org/GLM-5.1:
      input_cost: 1.05
      output_cost: 3.50
      cached_input_cost: 0.205
    zai-org/GLM-5.2:
      input_cost: 0.75
      output_cost: 2.40
      cached_input_cost: 0.14
    thinkingmachines/Inkling:
      input_cost: 0.95
      output_cost: 4.05
      cached_input_cost: 0.16
      # HTTP 405: "json_schema response format is not supported for model:
      # thinkingmachines/Inkling". json_object works; strict schemas do not.
      supports_structured_outputs: false

# Moonshot AI (OpenAI-compatible). First-party Kimi models only — Moonshot is the
# model vendor, not a multi-tenant inference platform. Model IDs are bare slugs.
# Rates below are the USD international platform (api.moonshot.ai); mainland-China
# accounts bill separately in RMB via api.moonshot.cn at different rates.
#
# Confirmed 2026-08-19 from Moonshot's own per-model pricing docs
# (platform.kimi.ai/docs/pricing/chat-k3.md, .../chat-k26.md), which label the
# columns cache-miss / cache-hit / output explicitly. The docs index at
# platform.kimi.ai/docs/llms.txt lists a pricing page per model.
moonshot:
  models:
    # Both SKUs pin their sampling parameters: "invalid temperature: only 1 is
    # allowed for this model" / "invalid top_p: only 0.95 is allowed". Sending
    # either value fails, and omitting both succeeds — so suppress them.
    kimi-k2.6:
      input_cost: 0.95
      output_cost: 4.00
      cached_input_cost: 0.16
      supports_temperature_top_p: false
    kimi-k3:
      input_cost: 3.00
      output_cost: 15.00
      cached_input_cost: 0.30
      supports_temperature_top_p: false

# Novita AI (OpenAI-compatible). Model IDs are lowercase slash-delimited and
# case-sensitive; note the org prefix differs from the HF-style platforms —
# Novita uses deepseek/deepseek-v4-pro where Baseten, Nebius, and DeepInfra use
# deepseek-ai/DeepSeek-V4-Pro. Novita also serves these routes under /openai and
# /v3/openai; the provider defaults to the /openai/v1 form its API reference documents.
#
# Rates confirmed 2026-08-19 from GET https://api.novita.ai/openai/v1/models,
# which needs no auth and returns pricing inline: pricing.prompt /
# pricing.input_cache_read / pricing.completion, each in units of 1e-4 USD per
# million tokens (14000 -> $1.40). The published pricing page agrees on all five.
# None of the models below use Novita's tiered billing (is_tiered_billing: false),
# so a single flat rate per class is correct.
novita:
  models:
    deepseek/deepseek-v4-pro:
      input_cost: 1.60
      output_cost: 3.20
      cached_input_cost: 0.135
      # HTTP 400: "does not support 'json_schema' response format. Supported
      # formats: json_object".
      supports_structured_outputs: false
    moonshotai/kimi-k2.6:
      input_cost: 0.80
      output_cost: 3.40
      cached_input_cost: 0.16
    moonshotai/kimi-k3:
      input_cost: 3.00
      output_cost: 15.00
      cached_input_cost: 0.30
    zai-org/glm-5.1:
      input_cost: 1.38
      output_cost: 4.40
      cached_input_cost: 0.26
      # HTTP 400: json_schema unsupported, json_object only (as deepseek-v4-pro).
      supports_structured_outputs: false
    zai-org/glm-5.2:
      input_cost: 1.40
      output_cost: 4.40
      cached_input_cost: 0.26

# Majordomo gateway (optimal routing). Canonical open-weight model names the
# Majordomo Steward gateway routes to the optimal backend (Fireworks, Together,
# …) at request time. These entries carry NO cost: the actual price is resolved
# per request from the backend the gateway selects, reported back via the
# X-Majordomo-Routed-Provider / X-Majordomo-Routed-Model response headers and
# looked up against that provider's rates above. Requires routing through the
# gateway (base_url + MAJORDOMO_API_KEY).
majordomo:
  models:
    deepseek-v4-pro: {}
    kimi-k2.6: {}
    kimi-k3: {}
    glm-5.1: {}
    glm-5.2: {}
    inkling: {}

# Deprecated model mappings
# When a user requests a deprecated model, it is automatically replaced with
# the provider-recommended replacement and a warning is logged.
deprecated_models:
  openai:
    gpt-4o: gpt-4.1
    gpt-4o-mini: gpt-4.1-mini
    gpt-5-pro: gpt-5.4-pro
    o1: o3
    o3-mini: o4-mini
  anthropic:
    claude-3-7-sonnet-20250219: claude-sonnet-4-6
    claude-3-5-haiku-20241022: claude-haiku-4-5-20251001
    claude-3-haiku-20240307: claude-haiku-4-5-20251001
    # Claude 4 family — the API 404s on these. Mapped to the current flagship of
    # the same tier, which is also cheaper for Opus ($15/$75 -> $5/$25).
    claude-opus-4-1-20250805: claude-opus-5
    claude-opus-4-20250514: claude-opus-5
    claude-sonnet-4-20250514: claude-sonnet-5
  gemini:
    gemini-3-pro-preview: gemini-3.1-pro-preview
    gemini-3.1-flash-lite-preview: gemini-3.1-flash-lite
    gemini-2.0-flash: gemini-2.5-flash
    gemini-2.0-flash-lite: gemini-2.5-flash-lite

# Logical model aliases
# Single provider: alias_name: { provider: ..., model: ... }
# Cascade (failover): alias_name: { cascade: [{ provider: ..., model: ... }, ...] }
aliases:
  # OpenAI GPT-5.6 flagship family
  openai-smart:
    provider: openai
    model: gpt-5.6-sol
  openai-balanced:
    provider: openai
    model: gpt-5.6-terra
  openai-fast:
    provider: openai
    model: gpt-5.6-luna
  fast:
    provider: anthropic
    model: claude-haiku-4-5-20251001
  thinking:
    provider: anthropic
    model: claude-sonnet-5
  smart:
    provider: anthropic
    model: claude-opus-5
  cheap:
    provider: gemini
    model: gemini-2.5-flash-lite
  resilient-sonnet:
    cascade:
      - provider: anthropic
        model: claude-sonnet-5
      - provider: openai
        model: gpt-5.6-terra
      - provider: gemini
        model: gemini-2.5-pro
  # Cross-vendor cascades for the same underlying open-weight model.
  # Order: Fireworks first (lower published price), Together as failover.
  deepseek-v4-pro:
    cascade:
      - provider: fireworks
        model: accounts/fireworks/models/deepseek-v4-pro
      - provider: together
        model: deepseek-ai/DeepSeek-V4-Pro
  # Reasoning + hard cascades end at Sonnet/Opus as the quality safety net.
  # Use these as Sonnet-with-thinking / Opus replacements respectively.
  deepseek-v4-pro-reasoning:
    cascade:
      - provider: fireworks
        model: deepseek-v4-pro-reasoning
      - provider: together
        model: deepseek-v4-pro-reasoning
      - provider: anthropic
        model: claude-sonnet-4-6
  deepseek-v4-pro-hard:
    cascade:
      - provider: fireworks
        model: deepseek-v4-pro-hard
      - provider: together
        model: deepseek-v4-pro-hard
      - provider: anthropic
        model: claude-opus-4-7
  kimi-k2.6:
    cascade:
      - provider: fireworks
        model: accounts/fireworks/models/kimi-k2p6
      - provider: together
        model: moonshotai/Kimi-K2.6
  glm-5.1:
    cascade:
      - provider: fireworks
        model: accounts/fireworks/models/glm-5p1
      - provider: together
        model: zai-org/GLM-5.1
  kimi-k3:
    cascade:
      - provider: fireworks
        model: accounts/fireworks/models/kimi-k3
      - provider: together
        model: moonshotai/Kimi-K3
  glm-5.2:
    cascade:
      - provider: fireworks
        model: accounts/fireworks/models/glm-5p2
      - provider: together
        model: zai-org/GLM-5.2
  inkling:
    cascade:
      - provider: fireworks
        model: accounts/fireworks/models/inkling
      - provider: together
        model: thinkingmachines/Inkling
