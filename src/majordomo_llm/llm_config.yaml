      input_cost: 0.06
      output_cost: 0.23
      max_tokens: 131072
    nvidia.nemotron-nano-3-30b:
      input_cost: 0.06
      output_cost: 0.24
      max_tokens: 262144
    nvidia.nemotron-super-3-120b:
